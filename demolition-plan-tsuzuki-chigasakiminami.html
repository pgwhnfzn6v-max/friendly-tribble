<g font-size="2.2">
  <text x="30" y="266.5">1. 本図は現地写真をもとに作成した略図。形状・寸法・スパン割は現地実測により確定する。</text>
  <text x="30" y="270.5">2. 撤去範囲＝ A：社名サイン付き上部梁／B：中段 大梁／C：車寄せ 採光屋根（ポリカ波板＋母屋）。</text>
  <text x="30" y="274.5">3. B（中段梁）は構造体。切断範囲・順序・仮支持（サポート）を検討。梁のみ撤去時は残る丸柱の安定を確認。</text>
  <text x="30" y="278.5">4. サイン内部の照明・電源配線、屋根下の照明・配線の切離しを事前に行う。</text>
  <text x="30" y="282.5">5. 高所作業（A 天端 H≒7m 想定）。高所作業車／足場、道路使用・歩道養生、営業中の車両移動を確認。</text>
  <text x="30" y="286.5">6. 石綿含有建材（成形板・シーリング等）の事前調査結果を確認のうえ着手。撤去材は分別・積込・搬出・処分。</text>
</g>
