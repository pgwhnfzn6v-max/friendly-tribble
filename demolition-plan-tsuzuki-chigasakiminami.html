  <text x="30" y="247.5">4. 高所作業は 道路側＝高所作業車、敷地内＝ローリングタワー（ローリング）で検討。道路使用許可・歩道養生の要否を確認。</text>
  <text x="30" y="251.5">5. サイン内部の照明・電源配線、屋根下の照明・配線は事前に切離し。梁・下地の切断は順序と仮支持を検討。</text>
  <text x="30" y="255.5">6. 営業中のため駐車車両の移動・養生、搬出経路の確保を事前調整。撤去材は分別・積込・搬出・処分。</text>
  <text x="30" y="259.5">7. 記号と部位の対応・パネルの位置は現地で確認し、本図に朱書きのこと。</text>
</g>
