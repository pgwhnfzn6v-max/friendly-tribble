<!-- 現場写真 印刷シート（ローカルで写真を選んで並べて印刷する） -->
<title>現場写真 印刷シート</title>
<meta charset="utf-8">
<style>
  :root{--cols:2;--rows:2;--pw:420mm;--ph:297mm;}
  *{box-sizing:border-box;}
  body{margin:0;background:#e9e9e9;font-family:'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN',sans-serif;}
  .toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #bbb;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px;}
  .toolbar label{display:flex;gap:5px;align-items:center;}
  .toolbar input[type=text]{padding:3px 5px;border:1px solid #bbb;border-radius:3px;}
  .toolbar button{padding:5px 12px;border:1px solid #888;border-radius:4px;background:#f5f5f5;cursor:pointer;}
  .toolbar button.primary{background:#222;color:#fff;border-color:#222;font-weight:bold;}
  .hint{color:#555;font-size:12px;}
  #drop{margin:14px auto;max-width:900px;padding:26px;border:2px dashed #999;border-radius:8px;background:#fff;text-align:center;color:#555;}
  #sheets{padding:14px 0 40px;}
  .page{width:var(--pw);height:var(--ph);background:#fff;margin:0 auto 14px;padding:10mm;display:flex;flex-direction:column;box-shadow:0 0 6px rgba(0,0,0,.3);}
  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:0.4mm solid #000;padding-bottom:1.5mm;margin-bottom:3mm;}
  .head .t{font-size:4.2mm;font-weight:bold;}
  .head .s{font-size:3mm;}
  .grid{flex:1;display:grid;gap:4mm;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);min-height:0;}
  .cell{display:flex;flex-direction:column;min-height:0;border:0.25mm solid #888;padding:1.5mm;}
  .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa;position:relative;}
  .imgwrap img{max-width:100%;max-height:100%;object-fit:contain;}
  .cap{display:flex;gap:2mm;align-items:center;margin-top:1.2mm;font-size:3.1mm;}
  .cap .no{font-weight:bold;white-space:nowrap;}
  .cap input{flex:1;font:inherit;border:none;border-bottom:0.2mm dotted #aaa;background:transparent;padding:0 1mm;}
  .tools{position:absolute;top:2px;right:2px;display:flex;gap:3px;}
  .tools button{font-size:11px;padding:2px 6px;border:1px solid #999;background:rgba(255,255,255,.9);border-radius:3px;cursor:pointer;line-height:1.2;}
  .foot{margin-top:2mm;font-size:2.6mm;text-align:right;}
  @page{size:A3 landscape;margin:0;}
  @media print{
    body{background:#fff;}
    .toolbar,#drop,.tools{display:none !important;}
    #sheets{padding:0;}
    .page{box-shadow:none;margin:0;break-after:page;page-break-after:always;}
    .page:last-child{break-after:auto;page-break-after:auto;}
    .cap input{border-bottom:none;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>

<div class="toolbar">
  <label>写真を選ぶ <input type="file" id="files" accept="image/*" multiple></label>
  <label>現場名 <input type="text" id="site" size="34" value="信和ホームズ㈱ 社屋 車寄せ（横浜市都筑区茅ケ崎南3-23-5）"></label>
  <label>撮影日 <input type="text" id="date" size="10" value="2026/09/02"></label>
  <label>用紙
    <select id="paper">
      <option value="420,297">A3 横</option>
      <option value="297,420">A3 縦</option>
      <option value="297,210">A4 横</option>
      <option value="210,297">A4 縦</option>
    </select>
  </label>
  <label>1枚あたり
    <select id="per">
      <option value="2,1">2枚（2×1）</option>
      <option value="2,2" selected>4枚（2×2）</option>
      <option value="3,2">6枚（3×2）</option>
      <option value="3,3">9枚（3×3）</option>
    </select>
  </label>
  <button id="sort">ファイル名順に並べ替え</button>
  <button id="clear">クリア</button>
  <button class="primary" id="print">印刷（カラー）</button>
  <span class="hint">印刷ダイアログで「余白：なし」「背景のグラフィック：ON」「カラー」を選んでください。</span>
</div>

<div id="drop">ここに写真をドラッグ＆ドロップ、または上の「写真を選ぶ」から選択（複数可）</div>
<div id="sheets"></div>

<script>
const items=[];
const $=id=>document.getElementById(id);

function addFiles(list){
  const arr=[...list].filter(f=>f.type.startsWith('image/'));
  arr.sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true}));
  arr.forEach(f=>items.push({url:URL.createObjectURL(f),name:f.name,cap:'',rot:0}));
  render();
}
$('files').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});
const drop=$('drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.background='#eef';}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.background='#fff';}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
['paper','per'].forEach(id=>$(id).addEventListener('change',render));
['site','date'].forEach(id=>$(id).addEventListener('input',render));
$('sort').onclick=()=>{items.sort((a,b)=>a.name.localeCompare(b.name,'ja',{numeric:true}));render();};
$('clear').onclick=()=>{items.length=0;render();};
$('print').onclick=()=>window.print();

function setPaper(){
  const [w,h]=$('paper').value.split(',').map(Number);
  document.documentElement.style.setProperty('--pw',w+'mm');
  document.documentElement.style.setProperty('--ph',h+'mm');
  const size=(w>h)?'A'+((w>400)?3:4)+' landscape':'A'+((h>400)?3:4)+' portrait';
  let st=document.getElementById('pagesize');
  if(!st){st=document.createElement('style');st.id='pagesize';document.head.appendChild(st);}
  st.textContent='@page{size:'+size+';margin:0;}';
}

function render(){
  setPaper();
  const [cols,rows]=$('per').value.split(',').map(Number);
  document.documentElement.style.setProperty('--cols',cols);
  document.documentElement.style.setProperty('--rows',rows);
  const per=cols*rows, pages=Math.max(1,Math.ceil(items.length/per));
  const box=$('sheets'); box.innerHTML='';
  drop.style.display=items.length?'none':'block';
  for(let p=0;p<pages;p++){
    const page=document.createElement('div'); page.className='page';
    page.innerHTML='<div class="head"><div class="t">現場写真　'+esc($('site').value)+'</div>'+
      '<div class="s">撮影日 '+esc($('date').value)+'　／　'+(p+1)+' / '+pages+'</div></div>'+
      '<div class="grid"></div><div class="foot">撤去範囲図（図番01）と併せて確認のこと</div>';
    const grid=page.querySelector('.grid');
    for(let i=p*per;i<Math.min((p+1)*per,items.length);i++){
      const it=items[i];
      const cell=document.createElement('div'); cell.className='cell';
      cell.innerHTML='<div class="imgwrap"><img src="'+it.url+'" alt="">'+
        '<div class="tools"><button data-a="rot">回転</button><button data-a="up">←</button><button data-a="down">→</button><button data-a="del">削除</button></div></div>'+
        '<div class="cap"><span class="no">写真 '+(i+1)+'</span><input type="text" placeholder="'+esc(it.name)+'"></div>';
      const inp=cell.querySelector('input'); inp.value=it.cap;
      inp.oninput=()=>{it.cap=inp.value;};
      cell.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{
        const a=b.dataset.a;
        if(a==='rot'){it.rot=(it.rot+90)%360;}
        else if(a==='del'){items.splice(i,1);}
        else if(a==='up'&&i>0){[items[i-1],items[i]]=[items[i],items[i-1]];}
        else if(a==='down'&&i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];}
        render();
      });
      grid.appendChild(cell);
      const img=cell.querySelector('img');
      img.onload=()=>applyRot(cell,it.rot);
      requestAnimationFrame(()=>applyRot(cell,it.rot));
    }
    box.appendChild(page);
  }
}
function applyRot(cell,rot){
  const wrap=cell.querySelector('.imgwrap'), img=cell.querySelector('img');
  if(!wrap||!img) return;
  img.style.transform='rotate('+rot+'deg)';
  if(rot%180===90){img.style.maxWidth=wrap.clientHeight+'px';img.style.maxHeight=wrap.clientWidth+'px';}
  else{img.style.maxWidth='100%';img.style.maxHeight='100%';}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
render();
window.addEventListener('resize',()=>render());
</script>
