name: SwitchBot「下上」を20分ごとに実行

# 日本時間 8:00〜23:00 の間、8:00 を起点に 20 分ごと（1日46回）。
# 20 分は 60 分を割り切るので、毎時 :00 :20 :40 の 1 本で表せる。
# GitHub Actions の cron は UTC 指定なので JST から 9 時間引いてある。
#
#   JST 8〜22時 :00 :20 :40 -> UTC 23時および 0〜13時
#   JST 23時 :00            -> UTC 14時

on:
  schedule:
    - cron: "0,20,40 23,0-13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      scene:
        description: "実行するシーン名（既定: 下上）"
        required: false
        default: "下上"

concurrency:
  group: switchbot-shita-ue
  cancel-in-progress: false

jobs:
  run-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 実行時刻（JST）を表示
        run: TZ=Asia/Tokyo date "+JST %Y-%m-%d %H:%M:%S"

      - name: シーンを実行
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          SWITCHBOT_SCENE: ${{ inputs.scene || '下上' }}
        run: python3 switchbot/run_scene.py
